<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151222">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon.png">
<title>Σημειωματάριο · Marmon 251</title>
<style>
:root{color-scheme:dark;--bg:#151222;--panel:#211d32;--border:#48405b;--ink:#faf7ff;--muted:#c8bfd9;--accent:#c5afff;--accent-ink:#20123d}
@media(prefers-color-scheme:light){:root:not([data-appearance=dark]){color-scheme:light;--bg:#f6f2ff;--panel:#fff;--border:#c9badd;--ink:#241931;--muted:#514560;--accent:#5736a1;--accent-ink:#fff}}
:root[data-appearance=light]{color-scheme:light;--bg:#f6f2ff;--panel:#fff;--border:#c9badd;--ink:#241931;--muted:#514560;--accent:#5736a1;--accent-ink:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 system-ui,sans-serif}header,main,nav>div{max-width:700px;margin:auto}header{padding:max(24px,env(safe-area-inset-top)) 18px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}header strong{font-size:1.04rem}main{padding:0 18px 120px}h1{font-size:clamp(2rem,8vw,3rem);margin:18px 0 14px;line-height:1.1}h2{font-size:1.17rem;margin:15px 0 6px}p{margin:5px 0 12px}.muted,small{color:var(--muted)}button,input,textarea,select{font:inherit}button,input,textarea,select{border:1px solid var(--border);border-radius:13px;background:var(--panel);color:var(--ink);min-height:52px;padding:10px 13px}button{cursor:pointer;font-weight:650}button.primary{background:var(--accent);color:var(--accent-ink);border:0}.wide{width:100%;margin:8px 0}label{display:block;margin:7px 0 3px}input:not([type=checkbox]),textarea,select{width:100%;min-width:0}textarea{min-height:92px;resize:vertical}.card{padding:14px;border:1px solid var(--border);border-radius:18px;background:var(--panel);margin:10px 0}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stats div{background:var(--bg);padding:9px;border-radius:10px}.stats strong{display:block;font-size:1.55rem}.item{width:100%;min-height:57px;text-align:left;margin:6px 0;overflow-wrap:anywhere}.item span{margin-right:8px;color:var(--accent)}.count{min-height:24px}.strike{text-decoration:line-through}.note{white-space:pre-wrap;overflow-wrap:anywhere}img{max-width:100%;max-height:320px;border-radius:12px}.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);padding:5px 4px max(6px,env(safe-area-inset-bottom))}.tabbar>div{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}.tabbar button{border:none;background:transparent;padding:3px 0;font-weight:600;font-size:.82rem;min-height:57px}.tabbar span{display:block;font-size:1.12rem}.tabbar [aria-current=page]{color:var(--accent);background:var(--panel)}[hidden]{display:none!important}dialog{color:var(--ink);background:var(--bg);width:min(94vw,550px);max-height:85dvh;border:1px solid var(--border);border-radius:16px;padding:16px}dialog::backdrop{background:#140c27b5}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.calendar-link{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:10px 13px;border:1px solid var(--border);border-radius:13px;background:var(--panel);color:var(--ink);font-weight:650;text-decoration:none}

:root[data-palette=blue]{--dark-accent:#a6ceff;--light-accent:#174f95;--dark-accent-ink:#0b2746}
:root[data-palette=green]{--dark-accent:#a5e2bb;--light-accent:#1a663d;--dark-accent-ink:#12331e}
:root[data-palette=rose]{--dark-accent:#ffc0d2;--light-accent:#922b56;--dark-accent-ink:#431b2b}
:root[data-palette]:not([data-palette=violet]){--accent:var(--dark-accent);--accent-ink:var(--dark-accent-ink)}
:root[data-appearance=light][data-palette]:not([data-palette=violet]){--accent:var(--light-accent);--accent-ink:white}
@media(prefers-color-scheme:light){:root:not([data-appearance=dark])[data-palette]:not([data-palette=violet]){--accent:var(--light-accent);--accent-ink:white}}
.header-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}.header-actions button{padding-inline:9px}
.note-photo{border:1px solid var(--border);border-radius:13px;margin:12px 0;padding:10px;min-width:0}
.photo-action{display:inline-flex;align-items:center;min-height:52px;margin:0;padding:10px 13px;border:1px solid var(--border);border-radius:13px;background:var(--panel);font-weight:650;cursor:pointer}
.visually-hidden{position:absolute!important;width:1px!important;height:1px!important;min-height:0!important;padding:0!important;clip-path:inset(50%);overflow:hidden}
.visually-hidden:focus-visible + .photo-action{outline:2px solid var(--accent);outline-offset:2px}
#clear-note-photo{display:block;margin-top:8px}button:disabled{opacity:.65;cursor:wait}
[data-tab=appointments]{position:relative}
.tabbar #appointment-count{position:absolute;top:2px;left:calc(50% + 9px);min-width:20px;padding:0 4px;border:1px solid var(--panel);border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:.7rem;line-height:17px;font-weight:750;text-align:center}
</style>
<script defer src="app.js?v=6"></script>
</head>
<body>
<header><strong>Σημειωματάριο · Marmon 251</strong><div class="header-actions"><button id="appearance" type="button">Χρώματα</button><button id="backup" type="button" aria-label="Αντίγραφα ασφαλείας">Αντίγραφα</button></div></header>
<main><h1 id="heading" tabindex="-1">Σήμερα</h1><div id="screen"></div></main>
<nav class="tabbar" aria-label="Καρτέλες"><div>
<button data-tab="today" type="button"><span aria-hidden="true">◷</span>Σήμερα</button>
<button data-tab="leave" type="button"><span aria-hidden="true">▦</span>Άδειες</button>
<button data-tab="appointments" type="button"><span aria-hidden="true">◈</span>Ραντεβού<span id="appointment-count" aria-hidden="true" hidden></span></button>
<button data-tab="shop" type="button"><span aria-hidden="true">✓</span>Ψώνια</button>
<button data-tab="notes" type="button"><span aria-hidden="true">≡</span>Σημειώσεις</button>
</div></nav>
<dialog id="editor" aria-labelledby="editor-heading"><h2 id="editor-heading"></h2><div id="editor-body"></div><button id="close-editor" type="button" class="wide">Κλείσιμο</button></dialog>
</body>
</html>
