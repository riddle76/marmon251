<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111b2a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon.png">
<title>Σημειωματάριο · Marmon 251</title>
<style>
:root{color-scheme:dark;--dark-bg:#111b2a;--dark-panel:#19283b;--dark-border:#3d506c;--dark-muted:#c3d3e7;--dark-accent:#a6ceff;--dark-accent-ink:#0b2746;--light-bg:#eef5ff;--light-panel:#fff;--light-border:#aebed4;--light-muted:#445b76;--light-accent:#174f95;--bg:var(--dark-bg);--panel:var(--dark-panel);--border:var(--dark-border);--ink:#f1f5f9;--muted:var(--dark-muted);--accent:var(--dark-accent);--accent-ink:var(--dark-accent-ink)}
:root[data-palette=green]{--dark-bg:#111f18;--dark-panel:#1a2d22;--dark-border:#3f5a4c;--dark-muted:#c1dfcd;--dark-accent:#a5e2bb;--dark-accent-ink:#12331e;--light-bg:#eef7f0;--light-panel:#fff;--light-border:#adc7b6;--light-muted:#405e4b;--light-accent:#1a663d}
:root[data-palette=graphite]{--dark-bg:#191c21;--dark-panel:#252a32;--dark-border:#49515f;--dark-muted:#c7ced7;--dark-accent:#dce4ef;--dark-accent-ink:#1f2937;--light-bg:#f1f3f5;--light-panel:#fff;--light-border:#b7bec9;--light-muted:#465363;--light-accent:#364253}
@media(prefers-color-scheme:light){:root:not([data-appearance=dark]){color-scheme:light;--bg:var(--light-bg);--panel:var(--light-panel);--border:var(--light-border);--ink:#17212d;--muted:var(--light-muted);--accent:var(--light-accent);--accent-ink:#fff}}
:root[data-appearance=light]{color-scheme:light;--bg:var(--light-bg);--panel:var(--light-panel);--border:var(--light-border);--ink:#17212d;--muted:var(--light-muted);--accent:var(--light-accent);--accent-ink:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 system-ui,sans-serif}header,main,nav>div{max-width:700px;margin:auto}header{padding:max(24px,env(safe-area-inset-top)) 18px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}header strong{font-size:1.04rem}main{padding:0 18px 120px}h1{font-size:clamp(2rem,8vw,3rem);margin:18px 0 14px;line-height:1.1}h2{font-size:1.17rem;margin:15px 0 6px}p{margin:5px 0 12px}.muted,small{color:var(--muted)}button,input,textarea,select{font:inherit}button,input,textarea,select{border:1px solid var(--border);border-radius:13px;background:var(--panel);color:var(--ink);min-height:52px;padding:10px 13px}button{cursor:pointer;font-weight:650}button.primary{background:var(--accent);color:var(--accent-ink);border:0}.wide{width:100%;margin:8px 0}label{display:block;margin:7px 0 3px}input:not([type=checkbox]),textarea,select{width:100%;min-width:0}textarea{min-height:92px;resize:vertical}.card{padding:14px;border:1px solid var(--border);border-radius:18px;background:var(--panel);margin:10px 0}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stats div{background:var(--bg);padding:9px;border-radius:10px}.stats strong{display:block;font-size:1.55rem}.item{width:100%;min-height:57px;text-align:left;margin:6px 0;overflow-wrap:anywhere}.item span{margin-right:8px;color:var(--accent)}.count{min-height:24px}.note{white-space:pre-wrap;overflow-wrap:anywhere}img{max-width:100%;max-height:320px;border-radius:12px}.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);padding:5px 4px max(6px,env(safe-area-inset-bottom))}.tabbar>div{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}.tabbar button{border:none;background:transparent;padding:3px 0;font-weight:600;font-size:.82rem;min-height:57px}.tabbar span{display:block;font-size:1.12rem}.tabbar [aria-current=page]{color:var(--accent);background:var(--panel)}[hidden]{display:none!important}dialog{color:var(--ink);background:var(--bg);width:min(94vw,550px);max-height:85dvh;border:1px solid var(--border);border-radius:16px;padding:16px}dialog::backdrop{background:#0b1422b5}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.calendar-link{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:10px 13px;border:1px solid var(--border);border-radius:13px;background:var(--panel);color:var(--ink);font-weight:650;text-decoration:none}

.header-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}.header-actions button{padding-inline:9px}
.note-photo{border:1px solid var(--border);border-radius:13px;margin:12px 0;padding:10px;min-width:0}
.photo-action{display:inline-flex;align-items:center;min-height:52px;margin:0;padding:10px 13px;border:1px solid var(--border);border-radius:13px;background:var(--panel);font-weight:650;cursor:pointer}
.visually-hidden{position:absolute!important;width:1px!important;height:1px!important;min-height:0!important;padding:0!important;clip-path:inset(50%);overflow:hidden}
.visually-hidden:focus-visible + .photo-action{outline:2px solid var(--accent);outline-offset:2px}
#clear-note-photo{display:block;margin-top:8px}button:disabled{opacity:.65;cursor:wait}
[data-tab=appointments]{position:relative}
.tabbar #appointment-count{position:absolute;top:2px;left:calc(50% + 9px);min-width:20px;padding:0 4px;border:1px solid var(--panel);border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:.7rem;line-height:17px;font-weight:750;text-align:center}

.shopping-group h3{margin:14px 0 2px;font-size:1rem;color:var(--muted)}
.note-tags{margin:6px 0}.note-tag{padding:3px 10px;border:1px solid var(--border);border-radius:12px;color:var(--accent);font-size:.88rem}
.scan-stage{position:relative;width:fit-content;max-width:100%;margin:18px auto}
.scan-stage canvas{display:block;max-width:100%;max-height:52dvh;width:auto;height:auto;border-radius:9px}
.scan-corner{position:absolute;display:grid;place-items:center;transform:translate(-50%,-50%);width:44px;height:44px;min-height:44px;padding:0;background:transparent;border:0;touch-action:none;z-index:1}
.scan-corner::after{content:"";width:20px;height:20px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px #172736}
.note-capture-actions{margin:2px 0 12px}.note-capture-actions button{overflow-wrap:anywhere}

.shopping-product-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px}
.shopping-photo-button{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:.83rem;padding-inline:8px}
.shopping-photo-button img{width:30px;height:34px;object-fit:cover;border-radius:5px}
.appointment-photo{display:block;margin:8px 0 12px;max-height:260px;object-fit:contain}

.organizer-dashboard{padding:18px}.organizer-heading{justify-content:space-between;margin-bottom:8px}
.organizer-heading h2,.card>.organizer-heading h2{margin:0;font-size:1.28rem}.organizer-heading strong{font-size:1.85rem;color:var(--accent)}
.organizer-dashboard ul{padding-inline-start:20px}.organizer-dashboard li{overflow-wrap:anywhere}
.task-check{display:flex;align-items:center;gap:10px;min-height:48px}.task-check input{min-height:0;width:20px;height:20px;accent-color:var(--accent)}
.service-history{padding-inline-start:22px}.service-history li{margin:10px 0}summary{padding-block:12px;cursor:pointer}
</style>
<script defer src="scan.js?v=7"></script>
<script defer src="organizer.js?v=10"></script>
<script defer src="app.js?v=10"></script>
</head>
<body>
<header><strong>Σημειωματάριο · Marmon 251</strong><div class="header-actions"><button id="appearance" type="button">Χρώματα</button><button id="backup" type="button" aria-label="Αντίγραφα ασφαλείας">Αντίγραφα</button></div></header>
<main><h1 id="heading" tabindex="-1">Σήμερα</h1><div id="screen"></div></main>
<nav class="tabbar" aria-label="Καρτέλες"><div>
<button data-tab="today" type="button"><span aria-hidden="true">◷</span>Σήμερα</button>
<button data-tab="leave" type="button"><span aria-hidden="true">▦</span>Άδειες</button>
<button data-tab="appointments" type="button"><span aria-hidden="true">◈</span>Ραντεβού<span id="appointment-count" aria-hidden="true" hidden></span></button>
<button data-tab="shop" type="button"><span aria-hidden="true">✓</span>Ψώνια</button>
<button data-tab="notes" type="button"><span aria-hidden="true">≡</span>Σημειώσεις</button>
</div></nav>
<dialog id="editor" aria-labelledby="editor-heading"><h2 id="editor-heading"></h2><div id="editor-body"></div><button id="close-editor" type="button" class="wide">Κλείσιμο</button></dialog>
</body>
</html>
